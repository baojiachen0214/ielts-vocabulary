/* V3.0 visual language — all learning, progress and audio data logic is unchanged. */
:root {
  --ink:#192626;
  --text:#253332;
  --muted:#697873;
  --accent:#365e52;
  --accent-light:#edf4f0;
  --bg:#f8f9f8;
  --card:#fff;
  --line:#e7ebe8;
  --blue:#416b79;
  --red:#b25a52;
  --red-light:#fcf3f1;
  --gold:#b38c4c;
  --radius:16px;
  --shadow:0 4px 22px rgba(26,44,38,.025);
  color-scheme:light;
}
body{background:var(--bg);color:var(--text);font-size:14px;letter-spacing:-.006em}
.sidebar {width:232px;padding:34px 17px 25px;background:#fff;border-color:#edf0ee;}
.brand {gap:12px;padding:0 9px 44px;font-size:17px;font-weight:680;line-height:1.25;letter-spacing:-.025em}
.brand-mark {width:39px;height:39px;border-radius:11px;background:#1d3e35;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;letter-spacing:-.09em;font-size:31px;font-weight:400;padding-right:5px}
.brand-dot{color:#b4cbbd;margin-left:-1px}
.brand-sub {letter-spacing:.15em;font-size:9px;margin-top:6px;color:#9aa6a0;font-weight:600}
.sidebar nav {gap:5px}
.nav {font-size:13.5px;font-weight:530;color:#687872;border-radius:10px;padding:12px 13px;gap:13px;min-height:45px;transition:background .15s,color .15s}
.nav:hover {background:#f6f8f6;color:#26473c}
.nav.active,.nav.active:hover {background:#edf4ef;color:#2e5a49;font-weight:650}
.nav .nav-icon {display:inline-flex;width:19px!important;height:19px;align-items:center;justify-content:center;font-size:14px!important;flex:none}
.nav-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.nav-count{font-size:11px!important;background:#f1f4f1!important;border:1px solid #e4ebe5;color:#547265;padding:1px 7px!important;border-radius:15px!important;line-height:1.5}
.sidebar-bottom{padding:22px 12px 2px;font-size:11px;line-height:1.7;border-top:1px solid #f0f2ef}
.sidebar-bottom .text-btn{margin:10px 0 20px}
main {margin-left:232px;max-width:none;padding:0 clamp(26px,4.5vw,64px) 40px}
.topbar{height:74px;margin-bottom:18px;border-color:#ebeeeb;max-width:1170px;margin-left:auto;margin-right:auto}
.breadcrumb{font-weight:580;color:#52665a;font-size:12px}
#save-status{font-size:11px;color:#798b7f}
.top-actions{gap:14px}
.top-actions .btn{background:transparent;border-color:#e0e6e1;color:#436456}
.view,#migration-banner,#storage-warning,main footer{max-width:1170px;margin-left:auto;margin-right:auto}
.page-head {margin:28px 0 26px;gap:28px}
.page-head h1{font-size:30px;line-height:1.3;letter-spacing:-.045em;font-weight:660;color:#213631;margin-bottom:8px}
.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:700;color:#6f8b7a;margin-bottom:10px}
.eyebrow-separator{margin:0 5px;color:#adbab0}
.lead {font-size:13px;color:#74847c;line-height:1.85}
.today-date{align-self:center;border:1px solid var(--line);color:#87958d;border-radius:30px;padding:6px 12px;font-size:11px;white-space:nowrap;background:#fff}
.btn {font-size:12.5px;font-weight:600;border-radius:9px;padding:10px 16px;min-height:39px;border-color:#e4eae5;background:#fff;color:#3b564b;box-shadow:none}
.btn:hover{background:#f5f8f5}
.btn.primary {background:#254e40;border-color:#254e40;color:#fff;box-shadow:0 4px 10px rgba(37,78,64,.10)}
.btn.primary:hover{background:#1c4033}
.btn.green {background:#356451;border-color:#356451}
.btn.ghost {background:transparent;color:#416c59;border-color:transparent}
.btn.ghost:hover {background:#edf5ef}
.btn.small{font-size:11.5px;padding:6px 12px;min-height:32px}
.text-btn {font-weight:600;font-size:12px;color:#3f6c57}
.text-btn:hover{text-decoration:underline}
.card {border-color:var(--line);padding:24px 25px;margin-bottom:18px;border-radius:14px;box-shadow:var(--shadow)}
.card h2 {font-size:15px;line-height:1.5;color:#293d36;font-weight:650}
.section-head{margin-bottom:22px;gap:20px}
.section-head .muted {font-size:11px;color:#88968d}
.caption {font-size:10.5px;line-height:1.8;color:#8a9990;margin-top:14px}
.notice{font-size:11.5px;line-height:1.75;padding:12px 16px;border-radius:10px;margin:0 0 15px;border-color:#dfe9e1;background:#f0f6f1;color:#54735f}
.notice.warn{background:#faf7ef;border-color:#e7deca;color:#846e43}
.notice.danger{background:#fdf3f1;border-color:#efdad5}
.notice .btn-row{margin-top:9px}
#migration-banner .notice:not(.warn){max-height:80px;overflow:auto}
/* The dashboard now follows a deliberate path: focus -> progress -> performance -> details. */
.dashboard-head{align-items:center;margin:32px 0 26px}
.focus-panel{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,.85fr);background:#edf4ef;border:1px solid #e0eae2;border-radius:17px;overflow:hidden;margin-bottom:32px;min-height:229px}
.focus-main{padding:28px 32px 30px;background:linear-gradient(125deg,#edf5ef 0%,#f1f6f1 78%,#f4f8f3 100%)}
.focus-kicker{font-size:11px;font-weight:650;letter-spacing:.035em;color:#577766;display:flex;align-items:center;gap:7px}
.focus-kicker-dot{height:7px;width:7px;background:#5f9872;border-radius:50%;display:inline-block}
.focus-title{display:flex;align-items:baseline;gap:12px;margin:14px 0 8px;color:#244a3a;line-height:1.2}
.focus-title strong{font-size:53px;font-weight:690;letter-spacing:-.07em;line-height:1;font-variant-numeric:tabular-nums}
.focus-title span{font-size:20px;font-weight:620;letter-spacing:-.03em}
.focus-main p{font-size:12px;color:#6b8174;line-height:1.7;margin:0 0 23px}
.focus-actions{display:flex;gap:8px;flex-wrap:wrap}
.focus-side{padding:30px 29px;border-left:1px solid #deeadf;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:#f7faf7}
.focus-side-eyebrow{font-size:10px;letter-spacing:.16em;color:#849f8a;font-weight:700;margin-bottom:16px}
.focus-side-title{font-size:16px;font-weight:650;color:#355549;letter-spacing:-.03em}
.focus-side-desc{font-size:12px;color:#819286;line-height:1.8;margin:7px 0 17px}
.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:6px 0 14px}
.section-title-row h2{font-size:16px;color:#2a3d33;font-weight:670;letter-spacing:-.025em;margin:0}
.section-title-row span{font-size:11px;color:#9aa89f}
.analysis-title{margin-top:30px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 20px}
.metric{padding:18px 19px 17px;border-radius:13px;border-color:#e9ede9;min-width:0;box-shadow:var(--shadow)}
.metric .label{font-size:11px;color:#859288;letter-spacing:.01em}
.metric .value{font-size:31px;color:#243e33;font-weight:660;margin:8px 0 6px;letter-spacing:-.05em;white-space:nowrap}
.metric .value small{font-size:12px;font-weight:500;letter-spacing:0;color:#a0aea4}
.metric .sub{font-size:10px;color:#a0ada4;line-height:1.6}
.dashboard-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.92fr);gap:16px;align-items:stretch}
.dashboard-grid .card{margin-bottom:0}
.set-progress{grid-template-columns:100px 1fr 55px;gap:13px;font-size:11px;margin:18px 0;color:#52675a}
.set-progress .number{font-size:10.5px;color:#809187}
.progress-bar{background:#eff2ef;height:6px}
.progress-bar span{background:#557e68;border-radius:10px}
.chart .bar {fill:#cee1d5}
.chart .line{stroke:#386b77;stroke-width:2}
.chart .point{fill:#386b77}
.chart text{font-size:10px;fill:#9eaaa2}
.chart .axis{stroke:#edf0ed}
.legend{font-size:10px;color:#84938a;margin-top:6px}
.segmented{background:#f5f7f5;border-color:#e9edea;border-radius:9px;padding:3px;gap:2px}
.segmented button{background:transparent;border-radius:6px;font-size:11px;padding:6px 9px;color:#78897e}
.segmented button.active{background:#fff;color:#365f50;box-shadow:0 1px 4px #213c3120}
/* Advanced analysis is always available but no longer visually overwhelms the dashboard. */
.insights-details{max-width:1170px;border:1px solid #e5ebe5;background:#fff;border-radius:13px;padding:0;margin:17px 0 6px;box-shadow:var(--shadow)}
.insights-details>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;cursor:pointer}
.insights-details>summary::-webkit-details-marker{display:none}
.insights-details summary>span:first-child{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.insights-details summary strong{font-size:13px;color:#38574a;font-weight:660}
.insights-details summary small{color:#98a79d;font-size:11px}
.details-open-icon{display:grid;place-items:center;border:1px solid #e7ece7;border-radius:8px;width:27px;height:27px;font-size:18px;color:#477761;transition:transform .2s;line-height:1}
.insights-details[open] .details-open-icon{transform:rotate(45deg)}
.insights-content{border-top:1px solid var(--line);padding:18px 20px 3px}
.insights-content .grid2{gap:16px}
.insights-content .card{box-shadow:none}
.insights-content .bar-row{font-size:11px;margin:14px 0}
.heat {border-radius:3px}
/* Practice should feel like an uncluttered work surface. */
.practice-shell{max-width:765px;margin:30px auto 12px}
.practice-shell>.card{box-shadow:0 6px 27px rgba(28,52,39,.04);border:1px solid #e5ebe5}
.practice-top{font-size:12px;color:#73847a;margin:12px 0 14px}
.practice-top:first-child span{font-size:13px;font-weight:680;color:#3a5d4c}
.practice-shell>.progress-bar{margin-bottom:20px!important;height:5px!important}
.practice-main{padding:42px clamp(22px,5vw,56px) 32px}
.practice-prompt{min-height:182px;margin-bottom:11px}
.prompt-label{letter-spacing:.065em;font-size:11px;color:#91a096;font-weight:550;margin-bottom:12px}
.prompt-meaning{font-size:29px;font-weight:650;letter-spacing:-.025em;color:#243d32;margin-bottom:18px;line-height:1.55;max-width:610px}
.speak-button{background:#eff6f0;border:1px solid #daeade;width:78px;height:78px;box-shadow:0 7px 20px rgba(63,118,83,.07);color:#436e55;transition:transform .15s,background .15s}
.speak-button:hover{transform:translateY(-2px);background:#e5f1e8}
.audio-status{font-size:11px;min-height:20px;color:#91a096;margin:9px 0 18px}
#answer-input.spell-input{font-size:27px!important;font-weight:550;letter-spacing:.02em;padding:16px!important;border:1.5px solid #dfe7e1!important;border-radius:11px!important;box-shadow:none;background:#fff;min-height:68px}
#answer-input.spell-input:focus{border-color:#66917c!important;outline:3px solid #e8f2ea;outline-offset:2px}
#answer-input.spell-input::placeholder{font-size:20px;font-weight:450;letter-spacing:0;color:#aeb9b0}
#answer-input.spell-input.fail{border-color:#ce9991!important;background:#fcf7f6}
#answer-input.spell-input.ok{border-color:#87b197!important;background:#f7fbf7}
.practice-tools{margin:14px 0 23px;font-size:11px;flex-wrap:wrap}
.practice-tools .text-btn{font-size:11.5px}
.practice-submit{min-height:49px!important;font-size:14px;padding:12px}
.keyboard-hint{font-size:10px;color:#a4aea6;margin:18px 0 0}
.feedback{border:1px solid #edf1eb;border-radius:11px;margin-top:25px;padding:21px}
.feedback .answer{font-size:27px}
/* Setup and wrong-book typography */
.set-option{border-radius:10px;padding:15px;min-height:73px}
.set-option:has(input:checked){border-color:#acc8b7;background:#f1f7f2}
.set-option strong{font-size:13px}
label.field{font-size:11.5px}
label.field select{min-height:41px}
.mode-note{background:#f8faf8;border:1px solid #edf1ed;color:#89978f;line-height:1.8;font-size:11.5px}
.wide-table{font-size:12px}
.wide-table th{font-size:11px;color:#91a096}
.wide-table td{padding-top:15px;padding-bottom:15px}
.wide-table td strong{font-size:14px;color:#2e4938}
#toast{left:calc(50% + 116px);background:#24493a;border-radius:11px;font-size:11.5px;box-shadow:0 7px 25px #112d202a}
main footer{font-size:10px;color:#a1ada4;margin-top:32px}
@media(min-width:1500px){main{padding-left:72px;padding-right:72px}}
@media(max-width:1200px){.dashboard-grid{grid-template-columns:minmax(0,1fr)}.dashboard-grid .card{margin-bottom:0}.metrics{gap:10px}.metric{padding:16px 14px}.metric .value{font-size:28px}}

/* v4 - immersive and distraction-free practice. Study records and browser storage remain unchanged. */
body.focus-mode {background:#fbfcfa;}
body.focus-mode .sidebar,body.focus-mode .topbar,body.focus-mode main footer,body.focus-mode #migration-banner{display:none!important}
body.focus-mode main{margin:0!important;padding:0!important;max-width:none!important;min-height:100svh;}
body.focus-mode #view-practice{margin:0;max-width:none;min-height:100svh;}
body.focus-mode .view:not(#view-practice){display:none}
.zen-shell{min-height:100svh;display:flex;flex-direction:column;width:100%;padding:0 clamp(24px,6vw,90px);background:#fbfcfa;color:#263b32;}
.zen-top{display:flex;align-items:center;gap:16px;width:100%;height:92px;margin:0 auto;max-width:1160px;justify-content:space-between;}
.zen-back,.zen-audio-settings{font:inherit;font-size:12px;font-weight:580;background:transparent;border:0;cursor:pointer;color:#82958b;padding:12px 0;display:inline-flex;align-items:center;gap:9px;transition:color .2s;}
.zen-back:hover,.zen-audio-settings:hover{color:#244f3d}
.zen-back{font-size:19px;color:#4a685b;}
.zen-back span{font-size:12px}
.zen-progress-meta{display:flex;align-items:center;justify-content:center;gap:16px;font-size:12px;font-weight:550;color:#6a8477;}
.zen-progress-meta span+span{letter-spacing:.035em;color:#385847;font-variant-numeric:tabular-nums}
.zen-progress-meta i{font-style:normal;color:#b9c9bf;padding:0 3px}
.zen-progress{height:3px;max-width:1160px;width:100%;background:#ebf0eb;margin:0 auto;border-radius:3px;overflow:hidden;}
.zen-progress>div{height:100%;background:#648c73;border-radius:3px;transition:width .24s ease;}
.zen-center{margin:auto auto;max-width:675px;width:100%;text-align:center;padding:54px 0 58px;}

.zen-status{font-size:11px;color:#93a398;line-height:1.55;min-height:20px;margin-top:15px;margin-bottom:46px;}

/* V5.1 refined practice: immovable inline correction, same footprint before and after grading */
:root {--ink:#244534;--accent:#315b46;--accent-light:#eff5ef;--bg:#f6f7f5;--line:#e5eae5;}
body.focus-mode{background:#fafbf9;}

.compact-zen .zen-question{font-size:clamp(26px,3vw,34px);font-weight:610;line-height:1.4;min-height:0;letter-spacing:-.035em;margin:0 0 31px;}

.compact-zen .zen-play{border-radius:14px;min-height:52px;padding:12px 20px;gap:10px;font-weight:630;font-size:13px;}
.compact-zen .zen-play:hover{transform:none;}
.compact-zen .zen-status{height:23px;min-height:23px;margin:13px 0 0;line-height:23px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

let audioDBPromise;
function audioDB() {
  if(!audioDBPromise)audioDBPromise=new Promise(resolve=>{
    if(!window.indexedDB){resolve(null);return;}
    let request;try{request=indexedDB.open('ielts_pronunciation_v2',1);}catch{resolve(null);return;}
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('audio'))request.result.createObjectStore('audio',{keyPath:'id'});};
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);request.onblocked=()=>resolve(null);
  });return audioDBPromise;
}
async function audioGet(id) {
  if(inMemoryAudio.has(id))return inMemoryAudio.get(id);
  const db=await audioDB();if(!db)return null;
  return new Promise(resolve=>{try{const r=db.transaction('audio').objectStore('audio').get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);}catch{resolve(null);}});

  $('azure-region').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();if(/^[a-z0-9-]{2,35}$/.test(v)){data.settings.region=v;persist();}else toast('区域只能包含字母、数字和连字符。');});
  $('azure-voice').addEventListener('change',e=>{stopAudio();cancelUpcomingAudio();data.settings.azureVoice=e.target.value;persist();});
  allAudio().then(items=>{if($('audio-cache-count'))$('audio-cache-count').textContent=`当前共 ${items.length} 段已缓存音频。每种声音 / 口音分别计数。`;});
}

$('backup-file').addEventListener('change',e=>{importBackup(e.target.files[0]);e.target.value='';});
$('audio-pack-file').addEventListener('change',e=>{importAudioPack(e.target.files[0]);e.target.value='';});
$('close-dialog').addEventListener('click',()=>$('word-dialog').close());
$('word-dialog').addEventListener('click',e=>{if(e.target===$('word-dialog'))$('word-dialog').close();});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.view){showView(b.dataset.view);return;}
  if(b.dataset.chartMode){chartMode=b.dataset.chartMode;renderDashboard();return;}
  if(b.dataset.startMode){startPractice(b.dataset.startMode);return;}
  if(b.dataset.detail){wordDetail(b.dataset.detail);return;}
  if(b.dataset.single){startPractice('spell',b.dataset.single);return;}
  if(b.dataset.archive){const id=b.dataset.archive;data.wordFlags[id]={archived:!data.wordFlags[id]?.archived,updatedAt:Date.now()};persist();renderWrong();return;}
  if(b.dataset.page){wrongFilter.page=Math.max(0,wrongFilter.page+Number(b.dataset.page));renderWrong();return;}
  switch(b.dataset.action){
    case 'export':exportBackup();break;
    case 'raw':exportRaw();break;
    case 'previous':{const value=storageRead(PREVIOUS_KEY);if(value)downloadFile(`雅思上次存档-${Date.now()}.json`,value);else toast('还没有可用的上次存档。');break;}
    case 'import':$('backup-file').click();break;
    case 'fresh':if(ensureCanStart()){persist();showView('dashboard');}break;
    case 'all-sets':{const boxes=[...document.querySelectorAll('#view-'+view+' input[name="practice-set"]')],checked=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!checked);break;}
    case 'resume':showView('practice');break;
    case 'pause':showView('dashboard');break;
    case 'open-audio-settings':showView('settings');break;
    case 'hint':showHint();break;
    case 'dont-know':submitAnswer(true);break;
    case 'play-current':if(currentWord()){playWord(currentWord().w);}break;
    case 'correction':correction();break;
    case 'check-correction':checkCorrection();break;
    case 'export-wrong':exportWrongCSV();break;
    case 'preview':playWord('library');break;
    case 'preview-contrast':playWord('garage');break;
    case 'enable-azure':{const key=$('azure-key').value.trim();if(!key){toast('请在本机输入官方 Speech 资源密钥。');break;}azureKey=key;$('azure-key').value='';data.settings.provider='azure';persist();renderSettings();toast('密钥仅在本次页面内存中生效。请先试听，再批量生成。');break;}
    case 'forget-key':azureKey='';if($('azure-key'))$('azure-key').value='';toast('本次页面中的密钥已清除，音频与学习进度保留。');break;
    case 'batch-audio':generateAudioBatch();break;
    case 'import-audio':$('audio-pack-file').click();break;
    case 'export-audio':exportAudioPack();break;
    case 'copy-script':{try{await navigator.clipboard.writeText(exportLegacyScript);toast('已复制。在原做题页面的开发者控制台执行。');}catch{$('legacy-script').focus();$('legacy-script').select();toast('已选中脚本，请按 Command + C 或 Ctrl + C 复制。');}break;}
    case 'download-script':downloadFile('旧版进度只读导出.js',exportLegacyScript,'text/javascript;charset=utf-8');break;
  }
});
// Single Shift press or Space replays a real audio recording. Shift used to type a capital letter does not replay.
// All 1,119 target spellings are single tokens; Space is deliberately reserved for replay on this practice screen.
document.addEventListener('keydown',e=>{
  if(view!=='practice'||$('word-dialog').open||e.isComposing)return;
  if(e.key==='Shift'&&!e.repeat){shiftPending=true;return;}
  if(e.shiftKey&&e.key!=='Shift')shiftPending=false;
  if(e.code==='Space'&&!e.repeat&&!e.altKey&&!e.ctrlKey&&!e.metaKey){
    // The practice screen reserves Space for playback even when the Next button has focus.
    e.preventDefault();document.querySelector('.zen-play')?.click();
  }
});
document.addEventListener('keyup',e=>{
  if(e.key!=='Shift')return;
  const replay=shiftPending&&view==='practice'&&!$('word-dialog').open&&!e.altKey&&!e.ctrlKey&&!e.metaKey;
  shiftPending=false;
  if(replay)document.querySelector('.zen-play')?.click();
});
window.addEventListener('blur',()=>{shiftPending=false;});
window.addEventListener('beforeunload',e=>{
  flushDraft();if(data.session||data.attempts.length||hasLegacy(data.legacy))persist();
  if(storageProblem||batchRunning){e.preventDefault();e.returnValue='';}
});
window.addEventListener('storage',e=>{
  if(e.key===STORE_KEY&&e.newValue&&e.newValue!==lastSaved){
    try{const incoming=validateV2(JSON.parse(e.newValue));const activeSession=data.session;data=mergeData(data,incoming);if(view==='practice')data.session=activeSession;lastSaved=e.newValue;includeLegacyWords();if(view!=='practice')showView(view);toast('已合并另一个标签页保存的作答记录。');}catch{warnStorage('另一个标签页的存档格式异常，已忽略并保留本页数据，请导出备份。');}
  }
});
// Audio-first practice: show Chinese meanings and parts of speech only after submission.
// All learning records, error history and the v2 localStorage schema are unchanged.
let retrySpelling = false;
let resultHoldUntil=0,resultHoldTimer,lastAnimatedAnswerId=null;
function protectAnswerResult(correct) {
  clearTimeout(resultHoldTimer);
  const button=$('submit-answer');
  if(correct){
    resultHoldUntil=0;
    button?.removeAttribute('aria-disabled');
    return;
  }
  resultHoldUntil=Date.now()+1000;
  button?.setAttribute('aria-disabled','true');
  resultHoldTimer=setTimeout(()=>{if(button?.isConnected)button.removeAttribute('aria-disabled');},1000);
}
function answerVisualState(correct,input,target) {
  if(correct)return 'correct';
  const diff=diffChars(input||'',target||'');
  const length=Math.max([...norm(input||'')].length,[...norm(target||'')].length,1);
  return diff.ops.some(op=>op.type==='same') && diff.distance/length<=0.5?'close':'wrong';
}
function animateAnswerResult(correct) {
  const badge=$('answer-verdict');
  if(!badge)return;
  const state=answerVisualState(correct,$('answer-input')?.value,currentWord()?.w);
  const shell=badge.closest('.compact-zen');
  shell?.classList.remove('result-correct','result-close','result-wrong');
  shell?.classList.add('result-'+state);
  badge.hidden=false;
  badge.classList.toggle('is-wrong',state==='wrong');
  badge.classList.toggle('is-close',state==='close');
  badge.setAttribute('aria-label',state==='correct'?'回答正确':state==='close'?'接近正确，仍需订正':'回答错误');
  const path=state==='correct'?'m7 16 6 6 12-13':state==='close'?'M16 7v12m0 6v.1':'m9 9 14 14M23 9 9 23';
  badge.innerHTML=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${path}"/></svg>`;
}

function inlineLetterDiff(input,target) {
  if(!input)return '<span class="empty-spelling">未作答</span>';
  return diffChars(input,target).ops.map(op=>{
    if(op.type==='same')return `<span class="letter-same">${escapeHTML(op.a)}</span>`;
    if(op.type==='missing')return `<ins class="letter-missing" title="漏写的字母">${escapeHTML(op.b)}</ins>`;
    if(op.type==='replace')return `<span class="letter-replacement"><del class="letter-error" title="写错的字母">${escapeHTML(op.a)}</del><ins class="letter-missing" title="应写的字母">${escapeHTML(op.b)}</ins></span>`;
    return `<del class="letter-error" title="多写的字母">${escapeHTML(op.a)}</del>`;
  }).join('');
}
function showInlineResult(answer,event,w) {
  const display=$('inline-answer');
  if(!display) return;
  display.hidden=false;
  display.classList.toggle('is-good',event.correct);
  display.classList.toggle('is-bad',!event.correct);
  display.innerHTML=event.correct ? escapeHTML(event.input||w.w) : inlineLetterDiff(event.input,w.w);
  display.setAttribute('aria-label',event.correct?'拼写正确：'+w.w:'你的拼写：'+(event.input||'未作答')+'。原词：'+w.w);
  $('answer-input').classList.add('is-answered');
}
renderPractice = function() {
  const session=data.session;
  if(!session){showView('listen');return;}
  if(session.index>=session.items.length){renderSessionEnd();return;}
  const w=currentWord();
  if(!w){$('view-practice').innerHTML=empty('此题单词暂不可用','请先导出备份，现有成绩不会被删除。');return;}
  const answered=session.answered;
  const spell=session.mode==='spell';
  retrySpelling=false;
  practiceStarted=Date.now();
  $('view-practice').innerHTML=`<div class="zen-shell compact-zen ${spell?'zen-spell':'zen-listen'}">
    <div class="zen-top">
      <button class="zen-back" data-action="pause" aria-label="保存进度并退出">← <span>返回</span></button>
      <div class="zen-progress-meta"><span>${spell?'拼写复习':'听写训练'}</span><span>${session.index+1}<i>/</i>${session.items.length}</span></div>
      <button class="zen-audio-settings" data-action="open-audio-settings">发音设置</button>
    </div>
    <div class="zen-progress"><div style="width:${Math.round(session.index/session.items.length*100)}%"></div></div>
    <div class="zen-center">
      <form id="answer-form" class="zen-answer-form">
        <div class="answer-verdict-slot"><div id="answer-verdict" class="answer-verdict" role="img" hidden></div></div>
        <div class="practice-answer-top">
          <label class="zen-input-label answer-word-label" for="answer-input">${answered?'<span class="original-label">原词</span><strong id="canonical-answer">'+escapeHTML(w.w)+'</strong>':'你的拼写'}</label>
          <button class="zen-play" type="button" data-action="play-current" aria-label="播放单词发音，Shift 或空格重听" title="Shift / 空格：重听">${speakerSVG}<span>${data.settings.autoPlay?'重听':'播放'}</span></button>
        </div>
        <div id="answer-meaning" class="answer-meaning" aria-live="polite">${answered?escapeHTML(w.m||'暂无中文释义'):''}</div>
        <div class="inline-answer-frame ${answered?(answered.correct?'answer-ok':'answer-wrong'):''}">
          <input id="answer-input" class="spell-input zen-input ${answered?'is-answered':''}" type="text" maxlength="150" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="输入你听到的英文单词" placeholder="输入英文单词" value="${escapeHTML(session.draft)}" ${answered?'readonly':''}>
          <div id="inline-answer" class="inline-answer" ${answered?'':'hidden'} aria-live="polite"></div>
        </div>

        <div id="feedback-area" class="inline-feedback" role="status" aria-live="polite"></div>
        <div class="practice-command-row">
          <div class="zen-minor-actions" id="practice-minor-actions">
            ${answered?`<button type="button" class="zen-quiet" data-detail="${escapeHTML(w.id)}">词条</button>${!answered.correct?'<button type="button" class="zen-quiet" data-action="correction">重新拼写</button>':''}`:
              '<button type="button" class="zen-quiet" data-action="hint">首字母提示</button><button type="button" class="zen-quiet" data-action="dont-know">暂时不会</button>'}
          </div>
          <button type="submit" class="zen-submit" id="submit-answer">${answered?'下一词':'确认'} <span>↵</span></button>
        </div>
      </form>
      <div id="audio-status" class="zen-status" role="status" aria-live="polite" hidden></div>
      ${practiceSources(w)}
      <div id="hint-status" hidden></div><div id="hint-content" hidden></div>
    </div>
    <div class="zen-footer"><span><kbd>Enter</kbd> ${answered?'下一题':'提交'}</span><span><kbd>Shift</kbd> / <kbd>空格</kbd> 重听</span><span>进度自动保存</span></div>
  </div>`;
  if(answered) renderFeedback(answered,w);
  $('answer-form').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.repeat||e.isComposing))e.preventDefault();});
  $('answer-form').addEventListener('submit',e=>{e.preventDefault();if(retrySpelling){checkCorrection();return;}if(data.session.answered)nextQuestion();else submitAnswer();});
  $('answer-input').addEventListener('input',()=>{
    if(retrySpelling) return; // Re-typing is deliberately not a new attempt or a new score.
    data.session.draft=$('answer-input').value;data.session.updatedAt=Date.now();
    clearTimeout(inputTimer);inputTimer=setTimeout(persist,250);
  });
  if(!answered) $('answer-input').focus({preventScroll:true});
  else $('submit-answer').focus({preventScroll:true});
  if(!answered && data.settings.autoPlay) playWord(w.w);
  preloadUpcomingAudio();
};
showHint = function() {
  if(!data.session || data.session.answered) return;
  const w=currentWord();data.session.assisted=true;data.session.updatedAt=Date.now();persist();
  $('feedback-area').innerHTML=`<span class="assist-note">首字母：<strong>${escapeHTML(w.w[0])}</strong> · 共 ${w.w.length} 个字符</span>`;
  $('answer-input').focus({preventScroll:true});
};
renderFeedback = function(event,w) {
  showInlineResult(event.input,event,w);
  if(event.id!==lastAnimatedAnswerId){
    lastAnimatedAnswerId=event.id;
    animateAnswerResult(event.correct);protectAnswerResult(event.correct);
  }

  animateAnswerResult(event.correct);
  $('feedback-area').textContent='';
};
correction = function() {
  if(!data.session?.answered || data.session.answered.correct) return;
  retrySpelling=true;
  $('answer-verdict').hidden=true;
  document.querySelector('.compact-zen')?.classList.remove('result-correct','result-close','result-wrong');
  clearTimeout(resultHoldTimer);resultHoldUntil=0;$('submit-answer').removeAttribute('aria-disabled');
  if($('canonical-answer'))$('canonical-answer').hidden=true;
  document.querySelector('.answer-word-label .original-label')?.setAttribute('hidden','');
  const input=$('answer-input'),form=$('answer-form');
  const result=$('inline-answer');
  if(result) result.hidden=true;
  input.readOnly=false;input.classList.remove('is-answered');input.value='';
  form.querySelector('.inline-answer-frame').className='inline-answer-frame';
  $('submit-answer').innerHTML='检查订正 <span>↵</span>';
  $('feedback-area').textContent='再写一次，首答成绩保留。';
  $('practice-minor-actions').innerHTML='';
  input.focus({preventScroll:true});
};
checkCorrection = function() {
  if(!retrySpelling) return;
  const input=$('answer-input'),correct=isRight(input.value,currentWord().w);
  if(!correct) {
    $('feedback-area').innerHTML='<span class="result-bad">仍有拼写差异，请再试一次</span>';
    animateAnswerResult(false);
    input.classList.add('retry-error');input.focus({preventScroll:true});return;
  }
  retrySpelling=false;
  const target=currentWord();
  document.querySelector('.answer-word-label').innerHTML='<span class="original-label">原词</span><strong id="canonical-answer">'+escapeHTML(target.w)+'</strong>';
  protectAnswerResult(true);
  $('inline-answer').hidden=false;
  $('inline-answer').innerHTML=escapeHTML(input.value);
  $('inline-answer').className='inline-answer is-good';
  input.classList.remove('retry-error');input.classList.add('is-answered');input.readOnly=true;
  document.querySelector('#answer-form .inline-answer-frame').className='inline-answer-frame answer-ok';
  animateAnswerResult(true);
  $('feedback-area').textContent='';
  $('submit-answer').innerHTML='下一词 <span>↵</span>';
  $('practice-minor-actions').innerHTML=`<button type="button" class="zen-quiet" data-detail="${escapeHTML(target.id)}">查看词条</button>`;
  $('submit-answer').focus({preventScroll:true});
};

// Hearing the actual audio is the task, not a hint; it never sets assisted=true.
// The original key handler and V5 Youdao playback logic remain unchanged.


let celebratedSessionId = null;
function celebrateGroup(sessionId) {
  if(celebratedSessionId===sessionId) return;
  celebratedSessionId=sessionId;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelector('.group-confetti')?.remove();
  const layer=document.createElement('div');
  layer.className='group-confetti';layer.setAttribute('aria-hidden','true');
  const colors=['#527e68','#e3b65b','#dc887e','#729eb8','#ad91bf'];
  for(let i=0;i<72;i++) {
    const piece=document.createElement('i');
    piece.style.left=(Math.random()*100)+'%';
    piece.style.background=colors[i%colors.length];
    layer.appendChild(piece);
    if(typeof piece.animate==='function') piece.animate([
      {transform:'translate3d(0,-20px,0) rotate(0deg)',opacity:1},
      {transform:`translate3d(${(Math.random()-.5)*260}px,${window.innerHeight+50}px,0) rotate(${360+Math.random()*540}deg)`,opacity:0}
    ],{duration:1600+Math.random()*900,delay:Math.random()*300,easing:'cubic-bezier(.18,.55,.5,1)',fill:'both'});
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),2900);
}
const originalRenderSessionEnd=renderSessionEnd;
renderSessionEnd=function() {
  originalRenderSessionEnd();
  celebrateGroup(data.session.id);
};


// Display choices stay in memory; the learning-record format is unchanged.
let librarySelection='';
let libraryScope='untouched';
let libraryLimit=20;
showView('dashboard');
if(!corruptStore&&(hasLegacy(data.legacy)||data.attempts.length||data.confirmedFresh))persist();
else if(!storageProblem)$('save-status').textContent='记录保存在当前浏览器';

</script>
